name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and regression tests
        run: python -m unittest discover -s tests -v
      - name: Offline CLI integration
        run: python tools/smoke_test.py
      - name: Skill installation to an isolated directory
        run: python tools/install_skill.py --destination artifacts/test-skills
      - name: Installed CLI
        run: python artifacts/test-skills/lottery-analyst/scripts/lottery_cli.py rules
